name: test and publish

# GitHub Pages already redeploys on every push. The point of this workflow is the
# gate: the 49-assertion suite has to pass before the site is replaced, so a broken
# build cannot quietly go live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the suite in headless Chrome
        run: CHROME="$(command -v google-chrome)" ./run-tests.sh

  publish:
    needs: test
    # Serialise deploys only. At workflow level this also cancels a superseded
    # run's TESTS — which reads as a failed build when nothing was wrong.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
